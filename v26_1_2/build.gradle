plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

// The Minecraft version this jar is built for and the mod dependencies built against
// it. Everything else is shared, see gradle/loom-common.gradle.
ext {
	minecraft_version = '26.1.2'
	fabric_api_version = '0.155.2+26.1.2'
	yacl_version = '3.9.6+26.1-fabric'
	modmenu_version = '18.0.1'
}

apply from: rootProject.file('gradle/loom-common.gradle')
